name: PM-Update Notify

# Ported from disasters-portal/.github/workflows/pm-update-notify.yml.
# There it keyed on the `PM-Update` label; here it keys on `smartsheet`, the
# label every migrated tracking row carries.
#
# The @-mention is what delivers the email -- GitHub notifies mentioned users
# at their account email address, so no SMTP secret is involved.
# Recipients come from the `PM_UPDATE_RECIPIENTS` repo variable, same as the
# source workflow (space- or comma-separated GitHub handles).
#
# Issues only: this repo holds the schedule, not code, so the source workflow's
# pull_request_target half would never fire and is dropped.

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'smartsheet')
    steps:
      - name: Comment and tag recipients
        uses: actions/github-script@v7
        env:
          RECIPIENTS: ${{ vars.PM_UPDATE_RECIPIENTS }}
        with:
          script: |
            const raw = process.env.RECIPIENTS || '';
            const mentions = raw
              .split(/[\s,]+/)
              .filter(Boolean)
              .map(h => '@' + h.replace(/^@+/, ''))
              .join(' ');

            const item = context.payload.issue;
            const owners = (item.labels || [])
              .map(l => l.name)
              .filter(n => n.startsWith('owner:'))
              .map(n => n.split(':')[1].trim())
              .join(', ');
            const assignees = (item.assignees || []).map(a => '@' + a.login).join(' ');
            const closedBy = context.payload.sender ? '@' + context.payload.sender.login : '—';
            const closedOn = (item.closed_at || new Date().toISOString()).slice(0, 10);
            const schedule = (item.body || '').match(/^\s*\**Schedule:?\**\s*:?.*$/mi);
            const endDate = schedule ? (schedule[0].match(/\d{4}-\d{2}-\d{2}/g) || []).slice(-1)[0] : null;

            // Markdown only: GitHub's notification email renders headings and
            // tables but strips arbitrary HTML/CSS. Blank lines are load-bearing
            // separators, so build the array by pushing rather than filtering.
            const notPlanned = item.state_reason === 'not_planned';
            const lines = [
              notPlanned ? '## 🚫 Dropped — not completed' : '## ✅ Completed',
              '',
              `**${item.title}**`,
              '',
            ];
            if (notPlanned) lines.push('**This item was closed as _not planned_. No work was completed.**', '');
            lines.push(
              '| Ticket | Owner | Scheduled end | Closed | Closed by |',
              '| :--- | :--- | :--- | :--- | :--- |',
              `| #${item.number} | ${owners || '—'} | ${endDate || '—'} | ${closedOn} | ${closedBy} |`,
              '',
            );
            if (assignees) lines.push(`${notPlanned ? 'Assigned to' : 'Worked by'} ${assignees}.`, '');
            lines.push(
              mentions
                ? `${mentions} — ${notPlanned ? 'dropped from the schedule; nothing was delivered.' : 'closing the loop for the schedule.'}`
                : '_No recipients configured — set the `PM_UPDATE_RECIPIENTS` repository variable (space-separated GitHub handles)._',
              '',
              '<sub>Automated by [`PM-Update Notify`](https://github.com/Disasters-Learning-Portal/disasters-tracking/blob/main/.github/workflows/pm-update-notify.yml) · [project board](https://github.com/orgs/Disasters-Learning-Portal/projects/5)</sub>'
            );
            const body = lines.join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              body,
            });
